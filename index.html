<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Student Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center text-indigo-900 tracking-tight">
            <i class="fa-solid fa-user-graduate mr-2"></i> Senior Student Directory
        </h1>
        
        <!-- Search and Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-gray-400"></i>
                </div>
                <input type="text" id="search" placeholder="Search by Name, Mobile, Father's Name, or Enrolment No..." 
                       class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow">
            </div>
            <select id="batch-filter" class="p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                <option value="All">🎓 All Batches</option>
            </select>
            <select id="state-filter" class="p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                <option value="All">📍 All States</option>
            </select>
        </div>

        <!-- Student Grid -->
        <div id="directory-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-gray-500 col-span-full text-center py-10">Loading database...</p>
        </div>
    </div>

    <script>
        let students = [];
        
        // Define the batch JSON files exported from Colab
        const jsonFiles = [
            '2021_directory.json', 
            '2022_directory.json', 
            '2023_directory.json', 
            '2024_directory.json', 
            '2025_directory.json'
        ];

        // Fetch all batch files simultaneously
        Promise.all(jsonFiles.map(file => 
            fetch(file).then(res => res.ok ? res.json() : [])
        )).then(results => {
            // Flatten arrays into one master list
            students = results.flat();
            populateFilters();
            renderGrid(students);
        }).catch(error => {
            document.getElementById('directory-grid').innerHTML = `<p class="text-red-500 col-span-full text-center font-bold">Error loading database. Make sure JSON files are uploaded to the same folder.</p>`;
        });

        function populateFilters() {
            const batches = [...new Set(students.map(s => s.batch).filter(Boolean))].sort();
            const states = [...new Set(students.map(s => s.state).filter(Boolean))].sort();
            
            const batchSelect = document.getElementById('batch-filter');
            batches.forEach(b => batchSelect.innerHTML += `<option value="${b}">${b}</option>`);
            
            const stateSelect = document.getElementById('state-filter');
            states.forEach(s => stateSelect.innerHTML += `<option value="${s}">${s}</option>`);
        }

        function renderGrid(data) {
            const grid = document.getElementById('directory-grid');
            if(data.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">No students found matching your criteria.</p>`;
                return;
            }

            grid.innerHTML = data.map(student => {
                // Dynamically construct image path based on batch year folder
                const imgPath = `photos_${student.batch}/${student.photo}`;
                
                return `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-100 overflow-hidden flex flex-col h-full">
                    <div class="p-5 flex gap-5">
                        <div class="w-32 h-36 flex-shrink-0">
                            <img src="${imgPath}" alt="${student.name}" 
                                 class="w-full h-full object-cover rounded-lg border border-gray-200 shadow-sm" 
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlNWU3ZWIiLz48cGF0aCBkPSJNNTAgNTBBNTggNTggMCAxIDAgNTAgNjBBNTggNTggMCAxIDAgNTAgNTBaIiBmaWxsPSIjY2JkNWUxIi8+PC9zdmc+'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-xl text-gray-900 truncate" title="${student.name}">${student.name || 'Unknown'}</h3>
                            <div class="inline-block mt-1 mb-3 px-2 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded">
                                Batch: ${student.batch || 'N/A'}
                            </div>
                            <p class="text-sm text-gray-700 mb-1"><i class="fa-solid fa-hashtag text-gray-400 w-5"></i> Enrol: ${student.enrolment_no || 'N/A'}</p>
                            <p class="text-sm text-gray-700 mb-1"><i class="fa-solid fa-phone text-gray-400 w-5"></i> ${student.mobile_no || 'N/A'}</p>
                            <p class="text-sm text-gray-700"><i class="fa-solid fa-map-pin text-gray-400 w-5"></i> ${student.state || 'N/A'}</p>
                        </div>
                    </div>
                    
                    <div class="bg-gray-50 p-4 mt-auto border-t border-gray-100 text-sm">
                        <div class="grid grid-cols-[auto_1fr] gap-x-2 gap-y-1 text-gray-600">
                            <span class="font-semibold">Father:</span> <span>${student.father_name || 'N/A'}</span>
                            <span class="font-semibold">DOB:</span> <span>${student.dob || 'N/A'}</span>
                            <span class="font-semibold">ID Mark:</span> <span>${student.identification_mark || 'N/A'}</span>
                            <span class="font-semibold">Address:</span> <span class="line-clamp-2" title="${student.permanent_address}">${student.permanent_address || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function filterData() {
            const query = document.getElementById('search').value.toLowerCase();
            const batch = document.getElementById('batch-filter').value;
            const state = document.getElementById('state-filter').value;

            const filtered = students.filter(s => {
                const searchStr = `${s.name || ''} ${s.mobile_no || ''} ${s.enrolment_no || ''} ${s.father_name || ''} ${s.permanent_address || ''}`.toLowerCase();
                const matchesText = searchStr.includes(query);
                const matchesBatch = batch === "All" || s.batch === batch;
                const matchesState = state === "All" || s.state === state;
                return matchesText && matchesBatch && matchesState;
            });
            renderGrid(filtered);
        }

        document.getElementById('search').addEventListener('input', filterData);
        document.getElementById('batch-filter').addEventListener('change', filterData);
        document.getElementById('state-filter').addEventListener('change', filterData);
    </script>
</body>
</html>
